[project]
name = "endb-project"
version = "0.1.0"
description = "엔지니어링DB 텀프로젝트 및 HW2 데이터 전처리"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11.3",
    "matplotlib>=3.11.2",
    "myloginpath>=0.0.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pymysql>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
